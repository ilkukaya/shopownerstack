[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Affiliate redirects live in dist/_redirects, generated at build time from the
# tools collection by src/integrations/affiliate-redirects.mjs. Do not add /go/
# rules here - they would have to be kept in sync by hand.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Fingerprinted build assets are safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Machine-readable files: short cache so updates reach crawlers quickly.
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"
